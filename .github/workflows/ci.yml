name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check src service tests
      - name: Unit tests
        run: pytest -q
      # A "smoke" train against the sandbox proves the whole pipeline wires up.
      # Network-restricted runners can skip this with the if: condition.
      - name: Smoke train
        if: ${{ vars.RUN_SMOKE_TRAIN == 'true' }}
        run: python -m src.retrain --force
